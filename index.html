<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام توزيع مناديب نعاون </title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
      :root { --primary: #2c3e50; --accent: #27ae60; --whatsapp: #25D366; --danger: #e74c3c; --light: #ecf0f1; --warning: #f39c12; --blue: #2980b9; --morning: #3498db; --evening: #8e44ad; --backup: #e67e22; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; color: var(--primary); }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 10px; font-size: 24px; margin-top: 0;}
        
        .admin-section { background: var(--light); padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #dcdde1; }
        .admin-section h3 { margin: 0 0 15px 0; font-size: 16px; color: #34495e; border-bottom: 1px solid #bdc3c7; padding-bottom: 8px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        
        .capacity-group { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        .capacity-group input { width: 70px; text-align: center; font-weight: bold; font-size: 16px; }
        
        .action-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        
        button { padding: 12px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { cursor: not-allowed; opacity: 0.6; }
        
        .btn-add { background: var(--accent); color: white; }
        .btn-random { background: #8e44ad; color: white; }
        .btn-pdf { background: #e67e22; color: white; }
        .btn-sync { background: var(--blue); color: white; }
        .btn-fetch { background: #16a085; color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-whatsapp { background: var(--whatsapp); color: white; padding: 4px 8px; font-size: 11px; }
        
        textarea, input[type="text"], input[type="tel"], input[type="number"] { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
        textarea:focus, input:focus { border-color: var(--accent); outline: none; }

        .shifts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .shift-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .shift-header { font-weight: bold; color: white; padding: 8px; border-radius: 5px; margin-bottom: 10px; text-align: center; }
        .header-morning { background: var(--morning); }
        .header-evening { background: var(--evening); }
        
        .delegate-item { background: #f9f9f9; padding: 10px; margin: 8px 0; border-right: 4px solid var(--accent); border-radius: 4px; border-left: 1px solid #eee; }
        .delegate-item.backup-item { border-right: 4px solid var(--backup); background: #fffaf0; }
        .item-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .delegate-name { font-weight: bold; font-size: 14px; }
        
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 4px; }
        .checkbox-group label { background: #eee; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .lbl-backup { border: 1px dashed var(--backup); }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
            .capacity-group { flex-direction: column; align-items: stretch; }
            .capacity-group button { width: 100%; }
            .action-buttons { grid-template-columns: 1fr 1fr; } 
        }
        @media (max-width: 480px) {
            .action-buttons { grid-template-columns: 1fr; } 
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; padding: 0; max-width: 100%; }
        }
    </style>
</head>
<body>

<h1 class="no-print">لوحة إدارة مناوبات نعاون ⚙️</h1>

    <div class="admin-section no-print">
        <h3>🛠️ العمليات الأساسية</h3>
        <div class="action-buttons">
            <button class="btn-fetch" onclick="fetchBookings()">📥 جلب حجوزات المناديب</button>
            <button id="syncBtn" class="btn-sync" onclick="saveToGoogleSheet()">☁️ اعتماد وحفظ في الشيت</button>
            <button id="pdfBtn" class="btn-pdf" onclick="downloadPDF()">📄 تصدير الجدول كـ PDF</button>
            <button class="btn-danger" onclick="clearTomorrow()">🗑️ تفريغ حجوزات الغد</button>
            <button class="btn-random" onclick="randomizeShifts()">🎲 توزيع ذكي (تلقائي)</button>
        </div>
    </div>

    <div class="admin-section no-print">
        <h3>📊 سعة الفترات (تطبق فوراً في صفحة المناديب)</h3>
        <div class="capacity-group">
            <label>الصباحي:</label>
            <input type="number" id="capMorning" value="5">
            <label>المسائي:</label>
            <input type="number" id="capEvening" value="5">
            <button class="btn-sync" onclick="updateCapacity()">💾 تحديث السعة</button>
        </div>
    </div>

    <div class="admin-section no-print">
        <h3>👤 إضافة مناديب يدوياً (للتعديلات الطارئة)</h3>
        <div class="grid-2">
            <div class="input-group">
                <input type="text" id="delegateName" placeholder="الاسم الكريم">
                <input type="tel" id="delegatePhone" placeholder="رقم الواتساب (انجليزي)" dir="ltr">
                <button class="btn-add" onclick="addSingle()">➕ إضافة فردية</button>
            </div>
            <div class="input-group">
                <textarea id="bulkInput" rows="3" placeholder="لصق (اسم المندوب، الرقم) كل واحد في سطر..."></textarea>
                <button class="btn-add" onclick="addBulk()">📋 إضافة مجموعة دفعة واحدة</button>
            </div>
        </div>
    </div>

    <div class="shifts-grid" id="shiftsContainer"></div>
</div>

<script>
    // 1. إعدادات الفترات الجديدة (8 صباحاً إلى 1 ليلاً) وأوقات التنبيه المرتبطة بها + تحديد الفترات التي تحتاج احتياطي
    const shiftsConfig = [
        { id: 1, time: "08:00 ص → 11:00 ص", type: "morning", notify: "07:30", needsBackup: true },
        { id: 2, time: "11:00 ص → 02:00 م", type: "morning", notify: "10:30", needsBackup: true },
        { id: 3, time: "02:00 م → 05:00 م", type: "morning", notify: "13:30", needsBackup: true },
        { id: 4, time: "05:00 م → 07:30 م", type: "evening", notify: "16:30", needsBackup: false },
        { id: 5, time: "07:30 م → 10:00 م", type: "evening", notify: "19:00", needsBackup: false },
        { id: 6, time: "10:00 م → 01:00 ص", type: "evening", notify: "21:30", needsBackup: false }
    ];

    // الرابط الخاص بك لجوجل شيت
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxBFyb77kdiV3MmRBhkiTaEXsVjlww3-pVLxmgRTaDEDiyDy6NUv8tk0Lpr1h-g6AlU5w/exec";

    let allDelegates = JSON.parse(localStorage.getItem('delegates_v5')) || [];
    
    // تحديث البيانات القديمة لتشمل مصفوفة الاحتياطي لكي لا يحدث خطأ برمجي
    allDelegates.forEach(d => { if(!d.backupShiftIds) d.backupShiftIds = []; });

    // --- دالة تصفية الرقم لسلطنة عمان ---
    function filterOmanPhone(phoneStr) {
        if (!phoneStr) return "";
        let p = phoneStr.toString().replace(/\D/g, ''); // إزالة الرموز مثل + والمسافات
        if (p.startsWith("968") && p.length >= 11) {
            return p.substring(3, 11); // أخذ 8 أرقام بعد 968
        }
        if (p.length > 8) {
            return p.slice(-8); // أخذ آخر 8 أرقام في حال عدم وجود 968 في البداية
        }
        return p;
    }

    function render() {
        const container = document.getElementById('shiftsContainer');
        container.innerHTML = '';

        shiftsConfig.forEach(shift => {
            const primaryDelegates = allDelegates.filter(d => d.shiftIds.includes(shift.id));
            const backupDelegates = allDelegates.filter(d => d.backupShiftIds.includes(shift.id));
            const allInShift = [...primaryDelegates, ...backupDelegates];

            const headerClass = shift.type === 'morning' ? 'header-morning' : 'header-evening';
            const shiftLabel = shift.type === 'morning' ? 'صباحي' : 'مسائي';
            
            const card = document.createElement('div');
            card.className = 'shift-card';
            card.innerHTML = `
                <div class="shift-header ${headerClass}">
                    الفترة ${shift.id} (${shiftLabel}) - العدد: ${primaryDelegates.length}<br>
                    <small dir="ltr">${shift.time}</small>
                </div>
                <div class="delegate-list">
                    ${allInShift.map(d => {
                        let isThisBackup = d.backupShiftIds.includes(shift.id);
                        return `
                        <div class="delegate-item ${isThisBackup ? 'backup-item' : ''}">
                            <div class="item-main">
                                <span class="delegate-name">${d.name} - ${d.phone || 'لا يوجد رقم'} ${isThisBackup ? '🛡️ (احتياطي)' : ''}</span>
                                <div style="display:flex; gap:5px;">
                                    <button class="btn-whatsapp" onclick="sendWhatsApp('${d.id}')">💬 واتساب</button>
                                    <button style="background:none; color:red; cursor:pointer;" onclick="deleteDelegate('${d.id}')">×</button>
                                </div>
                            </div>
                            <div class="checkbox-group">
                                ${shiftsConfig.map(s => {
                                    let isP = d.shiftIds.includes(s.id);
                                    let isB = d.backupShiftIds.includes(s.id);
                                    let html = `
                                    <label style="background: ${isP ? '#27ae60' : '#eee'}; color: ${isP ? 'white' : 'black'}">
                                        <input type="checkbox" style="display:none" onchange="toggleShift('${d.id}', ${s.id}, 'primary')" ${isP ? 'checked' : ''}>
                                        ${s.id}
                                    </label>`;
                                    if(s.needsBackup) {
                                        html += `
                                        <label class="lbl-backup" style="background: ${isB ? 'var(--backup)' : '#eee'}; color: ${isB ? 'white' : 'black'}">
                                            <input type="checkbox" style="display:none" onchange="toggleShift('${d.id}', ${s.id}, 'backup')" ${isB ? 'checked' : ''}>
                                            🛡️ ${s.id}
                                        </label>`;
                                    }
                                    return html;
                                }).join('')}
                            </div>
                        </div>
                    `}).join('')}
                </div>
            `;
            container.appendChild(card);
        });

        // قائمة الانتظار
        const unassignedDelegates = allDelegates.filter(d => d.shiftIds.length === 0 && d.backupShiftIds.length === 0);
        const unassignedCard = document.createElement('div');
        unassignedCard.className = 'shift-card';
        unassignedCard.style.border = '2px dashed var(--warning)';
        unassignedCard.innerHTML = `
            <div class="shift-header" style="background: var(--warning);">مناديب بدون فترة (انتظار)</div>
            <div class="delegate-list">
                ${unassignedDelegates.map(d => `
                    <div class="delegate-item" style="border-right-color: var(--warning);">
                        <div class="item-main">
                            <span class="delegate-name">${d.name} - ${d.phone || 'لا يوجد رقم'}</span>
                            <div style="display:flex; gap:5px;">
                                <button class="btn-whatsapp" onclick="sendWhatsApp('${d.id}')">💬 واتساب</button>
                                <button style="background:none; color:red; cursor:pointer;" onclick="deleteDelegate('${d.id}')">×</button>
                            </div>
                        </div>
                        <div class="checkbox-group">
                            ${shiftsConfig.map(s => {
                                let html = `
                                <label style="background: #eee; color: black">
                                    <input type="checkbox" style="display:none" onchange="toggleShift('${d.id}', ${s.id}, 'primary')">
                                    ${s.id}
                                </label>`;
                                if(s.needsBackup) {
                                    html += `
                                    <label class="lbl-backup" style="background: #eee; color: black">
                                        <input type="checkbox" style="display:none" onchange="toggleShift('${d.id}', ${s.id}, 'backup')">
                                        🛡️ ${s.id}
                                    </label>`;
                                }
                                return html;
                            }).join('')}
                        </div>
                    </div>
                `).join('')}
                ${unassignedDelegates.length === 0 ? '<p style="text-align:center; color:#7f8c8d; font-size:13px; margin-top:10px;">لا يوجد مناديب في قائمة الانتظار</p>' : ''}
            </div>
        `;
        container.appendChild(unassignedCard);

        localStorage.setItem('delegates_v5', JSON.stringify(allDelegates));
    }

    function addSingle() {
        const name = document.getElementById('delegateName').value;
        let phone = document.getElementById('delegatePhone').value;
        if (!name) return;
        
        phone = filterOmanPhone(phone); // تطبيق دالة تصفية الرقم

        allDelegates.push({ id: Date.now().toString(), name: name, phone: phone, shiftIds: [], backupShiftIds: [] });
        document.getElementById('delegateName').value = '';
        document.getElementById('delegatePhone').value = '';
        render();
    }

    function addBulk() {
        const raw = document.getElementById('bulkInput').value;
        const lines = raw.split('\n').filter(l => l.trim() !== "");
        lines.forEach(line => {
            const parts = line.split(/[،,]/);
            let phone = parts[1] ? parts[1].trim() : "";
            
            phone = filterOmanPhone(phone); // تطبيق دالة تصفية الرقم

            allDelegates.push({ 
                id: Math.random().toString(36).substr(2, 9), 
                name: parts[0].trim(), 
                phone: phone, 
                shiftIds: [],
                backupShiftIds: []
            });
        });
        document.getElementById('bulkInput').value = '';
        render();
    }

    function sendWhatsApp(delegateId) {
        const delegate = allDelegates.find(d => d.id === delegateId);
        if (!delegate.phone) { alert("يرجى إضافة رقم جوال لهذا المندوب أولاً"); return; }

        let message = `أهلاً ${delegate.name} \n\n`;
        let hasDuty = false;

        if (delegate.shiftIds && delegate.shiftIds.length > 0) {
            hasDuty = true;
            const sortedShifts = [...delegate.shiftIds].sort((a, b) => a - b);
            let shiftsText = sortedShifts.map(id => {
                const shift = shiftsConfig.find(s => s.id === id);
                return `▪️ الفترة رقم (${shift.id}): من ${shift.time}`;
            }).join('\n');
            message += `✅ *مناوباتك الأساسية:*\n${shiftsText}\n\n`;
        }
        
        if (delegate.backupShiftIds && delegate.backupShiftIds.length > 0) {
            hasDuty = true;
            const sortedBackup = [...delegate.backupShiftIds].sort((a, b) => a - b);
            let backupText = sortedBackup.map(id => {
                const shift = shiftsConfig.find(s => s.id === id);
                return `▪️ الفترة رقم (${shift.id}): من ${shift.time}`;
            }).join('\n');
            message += `🛡️ *مناوباتك (كابتن احتياطي):*\n${backupText}\n*(يرجى الجاهزية التامة في هذه الفترات لتفادي المخالفات)*\n\n`;
        }
        
        if (hasDuty) {
            message += `بالتوفيق!`;
        } else {
            message = `أهلاً ${delegate.name} \nأنت حالياً في قائمة الانتظار. سنقوم بالتواصل معك قريباً لتحديد موعد مناوبتك!`;
        }
        
        window.open(`https://wa.me/${delegate.phone}?text=${encodeURIComponent(message)}`, '_blank');
    }

    function toggleShift(delegateId, shiftId, type = 'primary') {
        const delegate = allDelegates.find(d => d.id === delegateId);
        if (delegate) {
            if (type === 'primary') {
                // التأكد من عدم الجمع بين الفترة 6 والفترة 1 حتى يدوياً
                if (!delegate.shiftIds.includes(shiftId)) {
                    if ((shiftId === 1 && delegate.shiftIds.includes(6)) || (shiftId === 6 && delegate.shiftIds.includes(1))) {
                        alert("تنبيه: لا يمكن الجمع بين الفترة 1 والفترة 6 للمندوب نفسه!");
                        return;
                    }
                }

                delegate.backupShiftIds = delegate.backupShiftIds.filter(id => id !== shiftId); // حذفه من الاحتياطي لنفس الفترة إن وجد
                if (delegate.shiftIds.includes(shiftId)) {
                    delegate.shiftIds = delegate.shiftIds.filter(id => id !== shiftId);
                } else {
                    delegate.shiftIds.push(shiftId);
                }
            } else {
                // التأكد من عدم الجمع بين الفترة 6 والفترة 1 في الاحتياطي
                if (!delegate.backupShiftIds.includes(shiftId)) {
                    if ((shiftId === 1 && delegate.backupShiftIds.includes(6)) || (shiftId === 6 && delegate.backupShiftIds.includes(1))) {
                        alert("تنبيه: لا يمكن الجمع بين الفترة 1 والفترة 6 للمندوب نفسه كاحتياطي!");
                        return;
                    }
                }

                delegate.shiftIds = delegate.shiftIds.filter(id => id !== shiftId); // حذفه من الأساسي لنفس الفترة إن وجد
                if (delegate.backupShiftIds.includes(shiftId)) {
                    delegate.backupShiftIds = delegate.backupShiftIds.filter(id => id !== shiftId);
                } else {
                    delegate.backupShiftIds.push(shiftId);
                }
            }
            render();
        }
    }

    function deleteDelegate(id) {
        if(confirm("هل أنت متأكد من حذف المندوب؟")) {
            allDelegates = allDelegates.filter(d => d.id !== id);
            render();
        }
    }

    // 2. خوارزمية التوزيع الذكي (شفتين للمندوب، لا للتتابع، 5 مسائي، 3 صباحي)
    function randomizeShifts() {
        if (allDelegates.length === 0) return alert("أضف مناديب أولاً!");

        allDelegates.forEach(d => { d.shiftIds = []; d.backupShiftIds = []; });
        let delegates = [...allDelegates];

        // توزيع الأساسيين أولاً
        delegates.forEach(delegate => {
            let assigned = 0;
            let attempts = 0;
            
            while(assigned < 2 && attempts < 20) {
                attempts++;
                
                let shiftNeeds = shiftsConfig.map(s => {
                    let currentCount = allDelegates.filter(d => d.shiftIds.includes(s.id)).length;
                    let target = (s.type === 'evening') ? 5 : 3;
                    return { id: s.id, need: target - currentCount };
                });

                shiftNeeds.sort((a,b) => (b.need - a.need) || (Math.random() - 0.5));

                for (let s of shiftNeeds) {
                    if (assigned >= 2) break;
                    let sId = s.id;

                    if (delegate.shiftIds.includes(sId)) continue;

                    // منع الشفتات المتتالية ومنع الجمع بين 1 و 6
                    if (delegate.shiftIds.length === 1) {
                        if (Math.abs(delegate.shiftIds[0] - sId) <= 1) continue;
                        if ((delegate.shiftIds[0] === 6 && sId === 1) || (delegate.shiftIds[0] === 1 && sId === 6)) continue;
                    }

                    delegate.shiftIds.push(sId);
                    assigned++;
                    break; 
                }
            }
            delegate.shiftIds.sort((a,b) => a - b);
        });

        // توزيع كابتن احتياطي واحد للفترات 1، 2، 3 بشكل عشوائي
        [1, 2, 3].forEach(sId => {
            let availableForBackup = delegates.filter(d => !d.shiftIds.includes(sId) && d.shiftIds.length < 3);
            if(availableForBackup.length > 0) {
                let randomBackup = availableForBackup[Math.floor(Math.random() * availableForBackup.length)];
                randomBackup.backupShiftIds.push(sId);
            }
        });

        render();
    }

    // 3. تصدير PDF احترافي (شفتين فقط في كل صفحة بالعرض لمنع الانقسام)
    function downloadPDF() {
        const pdfBtn = document.getElementById('pdfBtn');
        const originalText = pdfBtn.innerHTML;
        pdfBtn.innerHTML = '⏳ جاري التجهيز...';
        pdfBtn.disabled = true;

        let printHTML = `<div style="font-family: 'Segoe UI', Tahoma, sans-serif; direction: rtl; background: #fff;">`;

        for (let i = 0; i < shiftsConfig.length; i += 2) {
            printHTML += `<div style="page-break-after: always; padding: 20px; box-sizing: border-box; min-height: 200mm;">`;
            
            if (i === 0) {
                printHTML += `<h1 style="text-align: center; color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 10px; margin-bottom: 25px;">جدول مناوبات مناديب نعاون</h1>`;
            } else {
                printHTML += `<div style="height: 30px;"></div>`;
            }

            printHTML += `<div style="display: flex; justify-content: space-between; gap: 20px;">`;
            
            for(let j = 0; j < 2; j++) {
                if (i + j < shiftsConfig.length) {
                    const shift = shiftsConfig[i + j];
                    const primary = allDelegates.filter(d => d.shiftIds.includes(shift.id));
                    const backups = allDelegates.filter(d => d.backupShiftIds.includes(shift.id));
                    const headerBg = shift.type === 'morning' ? '#3498db' : '#8e44ad';
                    
                   let delegatesHTML = primary.map(d => {
                        let cleanPhone = filterOmanPhone(d.phone); // تنظيف الرقم القديم والجديد ليصبح 8 أرقام فقط
                        let phoneLink = cleanPhone ? `<a href="https://wa.me/968${cleanPhone}" style="color: #2980b9; text-decoration: none; direction: ltr; display: inline-block;" target="_blank">${cleanPhone}</a>` : 'لا يوجد رقم';
                        return `
                        <div style="background: #f9f9f9; padding: 12px; margin: 8px 0; border-right: 4px solid ${headerBg}; border-radius: 4px; border-left: 1px solid #eee; font-weight: bold; color: #333; font-size: 16px;">
                            ${d.name} - ${phoneLink}
                        </div>`;
                    }).join('');

                    let backupsHTML = backups.map(d => {
                        let cleanPhone = filterOmanPhone(d.phone); // تنظيف الرقم القديم والجديد ليصبح 8 أرقام فقط
                        let phoneLink = cleanPhone ? `<a href="https://wa.me/968${cleanPhone}" style="color: #2980b9; text-decoration: none; direction: ltr; display: inline-block;" target="_blank">${cleanPhone}</a>` : 'لا يوجد رقم';
                        return `
                        <div style="background: #fffaf0; padding: 12px; margin: 8px 0; border-right: 4px solid var(--backup); border-radius: 4px; border-left: 1px solid #eee; font-weight: bold; color: #d35400; font-size: 16px;">
                            🛡️ ${d.name} - ${phoneLink} (احتياطي)
                        </div>`;
                    }).join('');

                    if(primary.length === 0 && backups.length === 0) delegatesHTML = `<div style="text-align:center; color:#999; padding: 20px;">لا يوجد مناديب</div>`;

                    printHTML += `
                    <div style="flex: 1; border: 1px solid #ddd; border-radius: 10px; padding: 15px; box-sizing: border-box;">
                        <div style="font-weight: bold; background: ${headerBg}; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; font-size: 18px;">
                            الفترة ${shift.id} - المجموع: ${primary.length}<br>
                            <span style="font-size: 14px;" dir="ltr">${shift.time}</span>
                        </div>
                        <div>${delegatesHTML}${backupsHTML}</div>
                    </div>`;
                }
            }
            printHTML += `</div></div>`;
        }
        printHTML += `</div>`;

        const opt = { 
            margin: 0, 
            filename: 'جدول__المناوبات.pdf', 
            image: { type: 'jpeg', quality: 1 },
            html2canvas: { scale: 2, useCORS: true }, 
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
            pagebreak: { mode: 'css' },
            enableLinks: true // 🌟 تم إضافة هذا السطر لتفعيل النقر على الأرقام
        };

        html2pdf().set(opt).from(printHTML).save().then(() => {
            pdfBtn.innerHTML = originalText; pdfBtn.disabled = false;
        }).catch(err => {
            console.error("PDF Error: ", err); pdfBtn.innerHTML = originalText; pdfBtn.disabled = false;
            alert("حدث خطأ أثناء تصدير الملف.");
        });
    }

    // 4. الحفظ في جوجل شيت
    function saveToGoogleSheet() {
        const btn = document.getElementById('syncBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '⏳ جاري الإرسال لجوجل...';
        btn.disabled = true;

        let payload = [];
        allDelegates.forEach(d => {
            if (d.shiftIds && d.shiftIds.length > 0) {
                d.shiftIds.forEach(sId => {
                    const shiftData = shiftsConfig.find(s => s.id === sId);
                    payload.push({
                        name: d.name,
                        phone: d.phone || "",
                        shiftId: sId,
                        shiftTime: shiftData.time,
                        notifyTime: shiftData.notify,
                        isBackup: false
                    });
                });
            }
            
            if (d.backupShiftIds && d.backupShiftIds.length > 0) {
                d.backupShiftIds.forEach(sId => {
                    const shiftData = shiftsConfig.find(s => s.id === sId);
                    payload.push({
                        name: d.name,
                        phone: d.phone || "",
                        shiftId: sId,
                        shiftTime: shiftData.time,
                        notifyTime: shiftData.notify,
                        isBackup: true
                    });
                });
            }
        });

        if (payload.length === 0) {
            alert("⚠️ لم تقم بتوزيع أي مندوب على الفترات للحفظ!");
            btn.innerHTML = originalText; btn.disabled = false;
            return;
        }

        fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            alert("✅ تم الحفظ في جوجل شيت! الإشعارات ستعمل الآن في الخلفية.");
            btn.innerHTML = originalText; btn.disabled = false;
        })
        .catch(error => {
            console.log("تم الإرسال (CORS ignored)", error);
            alert("✅ تم إرسال الأمر! يرجى التحقق من الجدول للتأكد.");
            btn.innerHTML = originalText; btn.disabled = false;
        });
    }

   function fetchBookings() {
        const btn = document.querySelector('.btn-fetch');
        const originalText = btn.innerHTML;
        btn.innerHTML = '⏳ جاري الجلب...';
        btn.disabled = true;

        fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(response => {
            if (response.status === 'success') {
                
                // 🌟 قراءة السعة الحقيقية من الشيت وتحديث الشاشة فوراً 🌟
                if (response.capacities) {
                    document.getElementById('capMorning').value = response.capacities.morning;
                    document.getElementById('capEvening').value = response.capacities.evening;
                }

                if (response.data.length === 0) {
                    return; // البقاء بصمت لتحديث الأرقام فقط إذا كانت فارغة
                }
                
                let newDelegates = {};
                response.data.forEach(b => {
                    let key = b.phone + "_" + b.name; 
                    if (!newDelegates[key]) {
                        newDelegates[key] = { id: Math.random().toString(36).substr(2, 9), name: b.name, phone: filterOmanPhone(b.phone), shiftIds: [], backupShiftIds: [] };
                    }
                    if (b.isBackup) newDelegates[key].backupShiftIds.push(b.shiftId);
                    else newDelegates[key].shiftIds.push(b.shiftId);
                });

                allDelegates = Object.values(newDelegates);
                render();
                
                // 🌟 تنفيذ تفريغ حجوزات الغد تلقائياً في الخلفية بعد الجلب 🌟
                fetch(WEB_APP_URL + "?action=clearTomorrow", { method: 'POST', body: JSON.stringify({}) });
                
                alert("✅ تم جلب الحجوزات بنجاح! وتم تفريغ ورقة (حجوزات الغد) آلياً للاستعداد لليوم التالي.");
            } else {
                alert("⚠️ " + (response.message || "حدث خطأ في الجلب."));
            }
        })
        .catch(err => { alert("❌ حدث خطأ في الاتصال بالخادم."); })
        .finally(() => { btn.innerHTML = originalText; btn.disabled = false; });
    }
    
    render();
    function clearTomorrow() {
        if(!confirm("⚠️ تحذير: هل أنت متأكد من تفريغ ورقة حجوزات الغد؟ (تأكد أنك قمت بالحفظ أولاً)")) return;
        
        fetch(WEB_APP_URL + "?action=clearTomorrow", { method: 'POST', body: JSON.stringify({}) })
        .then(res => res.json())
        .then(data => alert("✅ تم تفريغ ورقة حجوزات الغد بنجاح، النظام جاهز لاستقبال الحجوزات الجديدة."))
        .catch(err => alert("✅ تم إرسال أمر التفريغ."));
    }

    function updateCapacity() {
        const morning = document.getElementById('capMorning').value;
        const evening = document.getElementById('capEvening').value;
        fetch(WEB_APP_URL + "?action=updateCapacity", {
            method: 'POST',
            body: JSON.stringify({ morning: morning, evening: evening })
        }).then(res => res.json())
        .then(data => alert("✅ تم تحديث سعة الفترات بنجاح. سيتم تطبيقها فوراً على حجز المناديب."));
    }

    // التحديث الآلي عند فتح لوحة الإدارة
    
    
</script>
